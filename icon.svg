<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sustainability Conference mark: the gear badge on BOI green.
       Colours are the brand tokens from globals.css — keep them in step. -->
  <rect width="64" height="64" rx="14" fill="#006430"/>
  <g fill="none" stroke="#d5ab57" stroke-width="3" stroke-linecap="round">
    <circle cx="32" cy="32" r="21.5"/>
    <g id="t">
      <line x1="32" y1="5.5" x2="32" y2="8.5"/>
      <line x1="32" y1="55.5" x2="32" y2="58.5"/>
    </g>
    <use href="#t" transform="rotate(30 32 32)"/>
    <use href="#t" transform="rotate(60 32 32)"/>
    <use href="#t" transform="rotate(90 32 32)"/>
    <use href="#t" transform="rotate(120 32 32)"/>
    <use href="#t" transform="rotate(150 32 32)"/>
  </g>
  <text x="32" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16.5" letter-spacing="-0.6">
    <tspan fill="#95c11f">S</tspan><tspan fill="#009cb4">C</tspan>
  </text>
</svg>
